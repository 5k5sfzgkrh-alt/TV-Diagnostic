name: Build TV Diagnostic v1.5.0 APK

on:
  push:
    branches: [ tv-diagnostic-v1.5.0 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack and validate reviewed v1.3.3 source
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q TV-Diagnostic-v1.3.3-project-root-reviewed.zip -d project
          SRC="project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          GRADLE="project/app/build.gradle.kts"
          test -s "$SRC"
          test -s "$GRADLE"
          grep -q 'versionCode = 133' "$GRADLE"
          grep -q 'versionName = "1.3.3"' "$GRADLE"
          grep -q 'com.tvdiagnostic.hi3751.v133' "$GRADLE"

      - name: Upgrade metadata to v1.5.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("project/app/build.gradle.kts")
          s = gradle.read_text(encoding="utf-8")
          replacements = [
              ("versionCode = 133", "versionCode = 150"),
              ('versionName = "1.3.3"', 'versionName = "1.5.0"'),
              ('applicationId = "com.tvdiagnostic.hi3751.v133"', 'applicationId = "com.tvdiagnostic.hi3751.v150"')
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit("Gradle metadata anchor mismatch: " + old)
              s = s.replace(old, new, 1)
          gradle.write_text(s, encoding="utf-8")
          src = Path("project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt")
          s = src.read_text(encoding="utf-8")
          s, title_count = re.subn(r'1\.3\.3', '1.5.0', s)
          old = 'put("appVersion", "1.3.0")'
          if s.count(old) != 1 or title_count < 1:
              raise SystemExit(f"Unexpected app source: title={title_count}, appVersion={s.count(old)}")
          s = s.replace(old, 'put("appVersion", "1.5.0")', 1)
          s = s.replace("tv-diagnostic-report-v120.json", "tv-diagnostic-report-v150.json")
          src.write_text(s, encoding="utf-8")
          import xml.etree.ElementTree as ET
          manifest = Path("project/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("Manifest application element missing")
          app.set("{http://schemas.android.com/apk/res/android}label", "TV Diagnostic 1.5.0")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
          grep -nE 'versionCode|versionName|applicationId' project/app/build.gradle.kts

      - name: Repair v1.3.3 Kotlin HTTP transfer source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          start = s.index("    private fun startLegacyArchiveHttpServer(")
          end = s.index("    private fun confirmSystemVendorBackup(", start)
          part = s[start:end]
          lines = part.splitlines()
          lines = [line for line in lines if line.strip() != "val out = client.getOutputStream()"]
          idx = next(i for i, line in enumerate(lines) if 'if (request.startsWith("GET /download?token=$token HTTP/"))' in line)
          lines.insert(idx, "                        val out = client.getOutputStream()")
          part = "\n".join(lines) + "\n"
          for before, after in [(r'\\r\\n', r'\r\n'), (r'\\n', r'\n'), (r'\\\"', r'\"'), (r"'\\n'", r"'\n'")]:
              part = part.replace(before, after)
          part = part.replace(chr(92) * 2 + '"', chr(92) + '"')
          s = s[:start] + part + s[end:]
          p.write_text(s, encoding="utf-8")
          print("Applied legacy HTTP transfer repair")
          PY

      - name: Apply existing read-only eMMC and performance diagnostics
        run: |
          python3 patches/v135_emmc_layout.py
          python3 patches/v140_performance_readonly.py

      - name: Apply v1.5.0 JSON reliability and hardware inventory
        run: |
          python3 patches/v150_readonly_report_hardware.py
          grep -nE 'hardwareInventoryV150|propertyInventory|writeVerifiedReportFile|onActivityResult|FileProvider' project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
          grep -n 'androidx.core:core' project/app/build.gradle.kts
          grep -n 'FileProvider' project/app/src/main/AndroidManifest.xml
          test -s project/app/src/main/res/xml/file_paths.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="\${ANDROID_HOME:-\${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Verify APK signature and hashes
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee project/APK-SHA256.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee project/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|application-label:"

      - name: Upload v1.5.0 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-v1.5.0-debug-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/APK-SHA256.txt
            project/APK-SIGNATURE.txt
          if-no-files-found: error
          retention-days: 14
