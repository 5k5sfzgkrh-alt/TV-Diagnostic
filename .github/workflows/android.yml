name: Android APK

on:
  push:
    branches: [ "main", "feature/tv-diagnostic-2.0-readonly" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Generate SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > APK-SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-2.0.0-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK-SHA256.txt
          if-no-files-found: error
