name: Build TV Diagnostic v1.3.1 parallel-install APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack v1.3.0 Android project
        run: |
          ARCHIVE="TV-Diagnostic-v1.3.0-project-root.zip"
          test -s "$ARCHIVE"
          mkdir -p project
          unzip -q "$ARCHIVE" -d project
          test -s project/settings.gradle.kts
          test -s project/app/build.gradle.kts
          test -s project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
          find project -maxdepth 5 -type f | sort | head -80

      - name: Extend large backup Wi-Fi download window
        run: |
          SRC=project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
          sed -i 's/server.soTimeout = 5 \* 60 \* 1000/server.soTimeout = 30 * 60 * 1000/' "$SRC"
          sed -i 's/Одноразовая ссылка, 5 минут/Одноразовая ссылка, 30 минут/' "$SRC"
          GRADLE=project/app/build.gradle.kts
          sed -i 's/versionCode = 130/versionCode = 131/' "$GRADLE"
          sed -i 's/versionName = "1.3.0"/versionName = "1.3.1"/' "$GRADLE"
          sed -i '/versionName = "1.3.1"/a\        applicationIdSuffix = ".v131"' "$GRADLE"
          grep -nE 'server.soTimeout|Одноразовая ссылка|versionCode|versionName|applicationIdSuffix' "$SRC" "$GRADLE"

      - name: Inspect Wi-Fi transfer timeout settings
        run: |
          grep -nEi 'timeout|serverSocket|ServerSocket|WiFi|wifi|http|TimeUnit' project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt | head -160 || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Verify APK and calculate SHA-256
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee project/APK-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-v1.3.1-parallel-debug-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14
