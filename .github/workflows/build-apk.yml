name: Build TV Diagnostic v1.4.0 APK

on:
  push:
    branches: [ main, tv-diagnostic-v1.3.5-emmc-layout, tv-diagnostic-v1.4.0-performance-readonly ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack v1.3.3 reviewed source project
        run: |
          ARCHIVE="TV-Diagnostic-v1.3.3-project-root-reviewed.zip"
          test -s "$ARCHIVE"
          mkdir -p project
          unzip -q "$ARCHIVE" -d project
          SRC="project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          GRADLE="project/app/build.gradle.kts"
          test -s "$SRC"
          test -s "$GRADLE"
          grep -q 'versionCode = 133' "$GRADLE"
          grep -q 'versionName = "1.3.3"' "$GRADLE"
          grep -q 'com.tvdiagnostic.hi3751.v133' "$GRADLE"
          echo "Validated reviewed source project v1.3.3"

      - name: Upgrade app metadata to v1.4.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("project/app/build.gradle.kts")
          s = gradle.read_text(encoding="utf-8")
          s, n1 = re.subn(r'versionCode\s*=\s*133', 'versionCode = 140', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"1\.3\.3"', 'versionName = "1.4.0"', s, count=1)
          s, n3 = re.subn(r'applicationId\s*=\s*"com\.tvdiagnostic\.hi3751\.v133"', 'applicationId = "com.tvdiagnostic.hi3751.v140"', s, count=1)
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f"Unexpected Gradle metadata: replacements={(n1,n2,n3)}")
          gradle.write_text(s, encoding="utf-8")
          src = Path("project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt")
          s = src.read_text(encoding="utf-8")
          s, title_count = re.subn(r'1\.3\.3', '1.4.0', s)
          s, app_count = re.subn(r'put\("appVersion",\s*"1\.3\.0"\)', 'put("appVersion", "1.4.0")', s)
          s = s.replace("tv-diagnostic-report-v120.json", "tv-diagnostic-report-v140.json")
          if title_count < 1 or app_count != 1:
              raise SystemExit(f"Unexpected app source: title replacements={title_count}, appVersion replacements={app_count}")
          src.write_text(s, encoding="utf-8")
          print("Updated UI/report version, JSON filename, package ID and versionCode")
          # Make the installed launcher/app label visibly versioned.
          res = Path("project/app/src/main/res")
          string_files = list(res.rglob("strings.xml")) if res.exists() else []
          label_updates = 0
          for item in string_files:
              text = item.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r'(<string\\s+name="app_name"[^>]*>).*?(</string>)',
                  r'\\1TV Diagnostic 1.4.0\\2',
                  text,
                  count=1,
                  flags=re.S
              )
              if count:
                  item.write_text(updated, encoding="utf-8")
                  label_updates += count
          if label_updates != 1:
              raise SystemExit(f"Expected exactly one app_name string, updated={label_updates}")
          print("Set launcher label to TV Diagnostic 1.4.0")

          PY
          grep -nE 'versionCode|versionName|applicationId' project/app/build.gradle.kts
          grep -nE '1.4.0|appVersion|tv-diagnostic-report-v140' project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt

      - name: Repair v1.3.3 Kotlin HTTP transfer source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          start = s.index("    private fun startLegacyArchiveHttpServer(")
          end = s.index("    private fun confirmSystemVendorBackup(", start)
          part = s[start:end]
          lines = part.splitlines()
          lines = [line for line in lines if line.strip() != "val out = client.getOutputStream()"]
          idx = next(i for i, line in enumerate(lines) if 'if (request.startsWith("GET /download?token=$token HTTP/"))' in line)
          lines.insert(idx, "                        val out = client.getOutputStream()")
          part = "\n".join(lines) + "\n"
          for before, after in [(r'\\r\\n', r'\r\n'), (r'\\n', r'\n'), (r'\\\"', r'\"'), (r"'\\n'", r"'\n'")]:
              part = part.replace(before, after)
          part = part.replace(chr(92) * 2 + '"', chr(92) + '"')
          s = s[:start] + part + s[end:]
          p.write_text(s, encoding="utf-8")
          print("Applied targeted Kotlin HTTP transfer repair")
          PY

      - name: Add read-only eMMC geometry and GPT diagnostics
        run: |
          python3 patches/v135_emmc_layout.py
          grep -nE 'eMMCLayout|collectEmmcLayout|runEmmcReadOnlyCommand' project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt

      - name: Add read-only performance diagnostics
        run: |
          python3 patches/v140_performance_readonly.py
          grep -nE 'performanceDiagnostics|collectPerformanceDiagnostics|collectCpuPerformance|collectZramPerformance' project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt

      - name: Print Kotlin compiler error context
        if: always()
        run: |
          nl -ba project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt | sed -n '1488,1552p'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Verify APK signature and calculate hashes
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee project/APK-SHA256.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee project/APK-SIGNATURE.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-v1.4.0-debug-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/APK-SHA256.txt
            project/APK-SIGNATURE.txt
          if-no-files-found: error
          retention-days: 14
