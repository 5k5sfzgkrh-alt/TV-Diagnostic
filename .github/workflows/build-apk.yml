name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source archive if present
        run: |
          if [ -f source-v0.3.0.zip ]; then unzip -q source-v0.3.0.zip -d extracted; fi

      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f TV_Diagnostic_Hi3751V553_build_kit_v0.3.0/settings.gradle.kts ]; then
            echo "PROJECT_DIR=TV_Diagnostic_Hi3751V553_build_kit_v0.3.0" >> "$GITHUB_ENV"
          elif [ -f extracted/TV_Diagnostic_Hi3751V553_build_kit_v0.3.0/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted/TV_Diagnostic_Hi3751V553_build_kit_v0.3.0" >> "$GITHUB_ENV"
          else
            echo "Gradle project not found. Archive contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Align Kotlin target with Android Java 8
        run: |
          find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | while IFS= read -r -d '' file; do
            sed -i \
              -e 's/JvmTarget.JVM_17/JvmTarget.JVM_1_8/g' \
              -e 's/jvmTarget = "17"/jvmTarget = "1.8"/g' \
              -e "s/jvmTarget = '17'/jvmTarget = '1.8'/g" \
              "$file"
          done
          echo "Java target is left at the Android Gradle Plugin default (1.8); Kotlin target is aligned to 1.8."

      - name: Patch Process type ambiguity
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          export SRC
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["SRC"])
          s = p.read_text()
          old = "private fun Process.waitForWithTimeout("
          new = "private fun java.lang.Process.waitForWithTimeout("
          if old not in s:
              raise SystemExit("Expected Process extension signature not found")
          p.write_text(s.replace(old, new, 1))
          assert new in p.read_text(), "Process type patch verification failed"
          print("Patched and verified java.lang.Process extension")
          PY

      - name: Print Kotlin error context for audit
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          echo "===== MainActivity.kt lines 315-345 ====="
          sed -n '315,345p' "$SRC"
          echo "===== MainActivity.kt lines 450-480 ====="
          sed -n '450,480p' "$SRC"

      - name: Audit report generation code
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          echo "===== REPORT/EXPORT REFERENCES ====="
          grep -n -i -E 'report|export|json|create.*file|FileProvider|ACTION_CREATE_DOCUMENT|writeText|OutputStream|Uri' "$SRC" || true
          echo "===== MAINACTIVITY SOURCE ====="
          cat "$SRC"

      - name: Make report export safe on Android TV
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          export SRC
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ['SRC'])
          s = p.read_text()
          pattern = r'    private fun exportReport\(\) \{.*?\n    \}\n(?=\n    private fun formatReport)'
          replacement = """    private fun exportReport() {
                  try {
                      val intent = android.content.Intent(android.content.Intent.ACTION_CREATE_DOCUMENT).apply {
                          addCategory(android.content.Intent.CATEGORY_OPENABLE)
                          type = "application/json"
                          putExtra(android.content.Intent.EXTRA_TITLE, "tv-diagnostic-report-v030.json")
                      }
                      startActivityForResult(intent, 4102)
                  } catch (e: Exception) {
                      try {
                          val dir = getExternalFilesDir(android.os.Environment.DIRECTORY_DOCUMENTS) ?: filesDir
                          val file = java.io.File(dir, "tv-diagnostic-report-v030.json")
                          file.writeText(lastReport.toString(2), Charsets.UTF_8)
                          statusView.text = "Окно сохранения недоступно. Отчёт сохранён внутри приложения: " + file.absolutePath
                      } catch (saveError: Exception) {
                          statusView.text = "Не удалось сохранить отчёт: " + (saveError.message ?: saveError.javaClass.simpleName)
                      }
                  }
              }
          """
          updated, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not safely locate exportReport()")
          p.write_text(updated)
          assert "tv-diagnostic-report-v030.json" in p.read_text()
          print("Android TV-safe report export patch applied")
          PY
      - name: Add report sharing button
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          export SRC
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["SRC"])
          s = p.read_text()
          old = '        val export = makeButton("Экспорт JSON") { exportReport() }\n'
          new = old + '        val share = makeButton("Поделиться отчётом") { shareReport() }\n'
          if old not in s: raise SystemExit("Export button anchor not found")
          s = s.replace(old, new, 1)
          old2 = '        buttons.addView(export)\n'
          new2 = old2 + '        buttons.addView(share)\n'
          if old2 not in s: raise SystemExit("Export button layout anchor not found")
          s = s.replace(old2, new2, 1)
          anchor = '    private fun formatReport(j: JSONObject): String {'
          method = '''    private fun shareReport() {
        try {
            val intent = android.content.Intent(android.content.Intent.ACTION_SEND).apply {
                type = "application/json"
                putExtra(android.content.Intent.EXTRA_SUBJECT, "Отчёт TV Diagnostic")
                putExtra(android.content.Intent.EXTRA_TEXT, lastReport.toString(2))
            }
            startActivity(android.content.Intent.createChooser(intent, "Отправить отчёт"))
            statusView.text = "Выбери приложение, через которое отправить отчёт"
        } catch (e: Exception) {
            statusView.text = "Не удалось открыть отправку: " + (e.message ?: e.javaClass.simpleName)
        }
    }

'''
          if anchor not in s: raise SystemExit("Report formatter anchor not found")
          s = s.replace(anchor, method + anchor, 1)
          p.write_text(s)
          assert 'Поделиться отчётом' in s and 'private fun shareReport()' in s
          print("Added share button and JSON share intent")
          PY

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
