name: Build TV Diagnostic v1.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack v1.3.0 Android project
        run: |
          ARCHIVE="TV-Diagnostic-v1.3.0-project-root.zip"
          test -s "$ARCHIVE"
          mkdir -p project
          unzip -q "$ARCHIVE" -d project
          test -s project/settings.gradle.kts
          test -s project/app/build.gradle.kts
          test -s project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
          echo "Project root: $GITHUB_WORKSPACE/project"
          find project -maxdepth 5 -type f | sort | head -80

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Verify APK and calculate SHA-256
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee project/APK-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-v1.3.0-debug-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 14
