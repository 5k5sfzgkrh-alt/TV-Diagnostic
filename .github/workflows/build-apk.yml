name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source archive if present
        run: |
          if [ -f source-v0.3.0.zip ]; then unzip -q source-v0.3.0.zip -d extracted; fi

      - name: Locate project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f TV_Diagnostic_Hi3751V553_build_kit_v0.3.0/settings.gradle.kts ]; then
            echo "PROJECT_DIR=TV_Diagnostic_Hi3751V553_build_kit_v0.3.0" >> "$GITHUB_ENV"
          elif [ -f extracted/TV_Diagnostic_Hi3751V553_build_kit_v0.3.0/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted/TV_Diagnostic_Hi3751V553_build_kit_v0.3.0" >> "$GITHUB_ENV"
          else
            echo "Gradle project not found. Archive contents:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Align Kotlin target with Android Java 8
        run: |
          find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | while IFS= read -r -d '' file; do
            sed -i \
              -e 's/JvmTarget.JVM_17/JvmTarget.JVM_1_8/g' \
              -e 's/jvmTarget = "17"/jvmTarget = "1.8"/g' \
              -e "s/jvmTarget = '17'/jvmTarget = '1.8'/g" \
              "$file"
          done
          echo "Java target is left at the Android Gradle Plugin default (1.8); Kotlin target is aligned to 1.8."

      - name: Patch Process type ambiguity
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          export SRC
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["SRC"])
          s = p.read_text()
          old = "private fun Process.waitForWithTimeout("
          new = "private fun java.lang.Process.waitForWithTimeout("
          if old not in s:
              raise SystemExit("Expected Process extension signature not found")
          p.write_text(s.replace(old, new, 1))
          assert new in p.read_text(), "Process type patch verification failed"
          print("Patched and verified java.lang.Process extension")
          PY

      - name: Make report export safe on Android TV
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          export SRC
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ['SRC'])
          s = p.read_text()
          pattern = r'    private fun exportReport\(\) \{.*?\n    \}\n(?=\n    private fun formatReport)'
          replacement = """    private fun exportReport() {
                  try {
                      val intent = android.content.Intent(android.content.Intent.ACTION_CREATE_DOCUMENT).apply {
                          addCategory(android.content.Intent.CATEGORY_OPENABLE)
                          type = "application/json"
                          putExtra(android.content.Intent.EXTRA_TITLE, "tv-diagnostic-report-v030.json")
                      }
                      startActivityForResult(intent, 4102)
                  } catch (e: Exception) {
                      try {
                          val dir = getExternalFilesDir(android.os.Environment.DIRECTORY_DOCUMENTS) ?: filesDir
                          val file = java.io.File(dir, "tv-diagnostic-report-v030.json")
                          file.writeText(lastReport.toString(2), Charsets.UTF_8)
                          statusView.text = "Окно сохранения недоступно. Отчёт сохранён внутри приложения: " + file.absolutePath
                      } catch (saveError: Exception) {
                          statusView.text = "Не удалось сохранить отчёт: " + (saveError.message ?: saveError.javaClass.simpleName)
                      }
                  }
              }
          """
          updated, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not safely locate exportReport()")
          p.write_text(updated)
          assert "tv-diagnostic-report-v030.json" in p.read_text()
          print("Android TV-safe report export patch applied")
          PY

      - name: Add report sharing button with real JSON attachment
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          export SRC
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ["SRC"])
          s = p.read_text()
          old = """        val export = makeButton("Экспорт JSON") { exportReport() }
          """
          new = old + """        val share = makeButton("Поделиться отчётом") { shareReport() }
          """
          if "val share = makeButton(\"Поделиться отчётом\")" not in s:
              if old not in s:
                  raise SystemExit("Export button anchor not found")
              s = s.replace(old, new, 1)
          old2 = """        buttons.addView(export)
          """
          new2 = old2 + """        buttons.addView(share)
          """
          if "buttons.addView(share)" not in s:
              if old2 not in s:
                  raise SystemExit("Export button layout anchor not found")
              s = s.replace(old2, new2, 1)
          anchor = "    private fun formatReport(j: JSONObject): String {"
          method = '''    private fun shareReport() {
              try {
                  if (android.os.Build.VERSION.SDK_INT < 29) {
                      statusView.text = "Отправка файла требует Android 10 или новее"
                      return
                  }
                  val values = android.content.ContentValues().apply {
                      put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, "tv-diagnostic-report.json")
                      put(android.provider.MediaStore.MediaColumns.MIME_TYPE, "application/json")
                      put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/TV Diagnostic")
                  }
                  val uri = contentResolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: throw IllegalStateException("Не удалось создать JSON-файл")
                  contentResolver.openOutputStream(uri)?.use { output ->
                      output.write(lastReport.toString(2).toByteArray(Charsets.UTF_8))
                  } ?: throw IllegalStateException("Не удалось записать JSON-файл")
                  val intent = android.content.Intent(android.content.Intent.ACTION_SEND).apply {
                      type = "application/json"
                      putExtra(android.content.Intent.EXTRA_SUBJECT, "Отчёт TV Diagnostic")
                      putExtra(android.content.Intent.EXTRA_STREAM, uri)
                      clipData = android.content.ClipData.newUri(contentResolver, "TV Diagnostic report", uri)
                      addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  startActivity(android.content.Intent.createChooser(intent, "Отправить файл отчёта"))
                  statusView.text = "JSON-файл создан. Выбери приложение для отправки"
              } catch (e: Exception) {
                  statusView.text = "Не удалось подготовить файл отчёта: " + (e.message ?: e.javaClass.simpleName)
              }
          }

          '''
          if "private fun shareReport()" in s:
              s = re.sub(r'    private fun shareReport\(\) \{.*?\n    \}\n(?=\s*private fun formatReport)', method, s, count=1, flags=re.S)
          else:
              if anchor not in s:
                  raise SystemExit("Report formatter anchor not found")
              s = s.replace(anchor, method + anchor, 1)
          p.write_text(s)
          assert "MediaStore.Downloads.EXTERNAL_CONTENT_URI" in s
          assert "EXTRA_STREAM, uri" in s
          assert "buttons.addView(share)" in s
          print("Verified: share action creates a JSON file and sends its content URI")
          PY


      - name: Apply TV Diagnostic v0.4.0 source changes
        run: |
          SRC="$PROJECT_DIR/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt"
          GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          export SRC GRADLE
          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle = Path(os.environ["GRADLE"])
          gs = gradle.read_text()
          if "versionName = \"0.3.0\"" in gs:
              gs = gs.replace("versionCode = 3", "versionCode = 4", 1)
              gs = gs.replace('versionName = "0.3.0"', 'versionName = "0.4.0"', 1)
          if 'versionName = "0.4.0"' not in gs:
              raise SystemExit("Version update failed")
          gradle.write_text(gs)

          path = Path(os.environ["SRC"])
          s = path.read_text()
          s = s.replace("Hi3751V553  •  0.2.0", "Hi3751V553  •  0.4.0", 1)
          s = s.replace("import android.opengl.GLSurfaceView",
                        "import android.opengl.GLSurfaceView\nimport android.media.MediaCodecList", 1)
          s = s.replace('j.put("timestamp", System.currentTimeMillis())',
                        'j.put("timestamp", System.currentTimeMillis())\n        j.put("appVersion", BuildConfig.VERSION_NAME)', 1)
          s = s.replace('j.put("uptime", readText("/proc/uptime", 1000))',
                        'j.put("uptime", readText("/proc/uptime", 1000))\n        j.put("partitionInfo", collectPartitionInfo())', 1)
          s = s.replace('j.put("gpu", gpuInfo)',
                        'j.put("gpu", gpuInfo)\n        j.put("mediaCodecs", collectMediaCodecs())', 1)

          methods = r"""
              private fun collectPartitionInfo(): JSONObject = JSONObject().apply {
                  put("procPartitions", readText("/proc/partitions", 12000))
                  put("mounts", readText("/proc/mounts", 12000))
                  val devices = JSONArray()
                  File("/sys/block").listFiles()?.sortedBy { it.name }?.forEach { devices.put(it.name) }
                  put("blockDevices", devices)
                  put("note", "Доступные блочные устройства и точки монтирования; не полный дамп таблицы разделов")
              }

              private fun collectMediaCodecs(): JSONArray {
                  val result = JSONArray()
                  return try {
                      MediaCodecList(MediaCodecList.ALL_CODECS).codecInfos.forEach { info ->
                          val types = info.supportedTypes.filter { it.startsWith("video/", ignoreCase = true) }
                          if (types.isNotEmpty()) result.put(JSONObject().apply {
                              put("name", info.name)
                              put("encoder", info.isEncoder)
                              put("videoTypes", JSONArray(types))
                              if (Build.VERSION.SDK_INT >= 29) put("hardwareAccelerated", info.isHardwareAccelerated)
                          })
                      }
                      result
                  } catch (e: Exception) {
                      result.put(JSONObject().put("error", e.message ?: "codec list unavailable"))
                      result
                  }
              }

          """
          anchor = "    private fun collectCpuFrequencies(): JSONArray {"
          if "private fun collectMediaCodecs()" not in s:
              if anchor not in s: raise SystemExit("Method insertion anchor missing")
              s = s.replace(anchor, methods + anchor, 1)

          s = s.replace("tv-diagnostic-report-v030.json", "tv-diagnostic-report-v040.json")
          s = s.replace('''            appendLine(j.optString("gpu"))
            appendLine()''',
                        '''            appendLine(j.optString("gpu"))
            val codecs = j.optJSONArray("mediaCodecs") ?: JSONArray()
            appendLine("Видеокодеки: ${codecs.length()} записей")
            appendLine()''', 1)
          s = s.replace('''            appendLine("ЭКРАН")''',
                        '''            appendLine("НАКОПИТЕЛЬ И РАЗДЕЛЫ")
            val part = j.optJSONObject("partitionInfo") ?: JSONObject()
            val devices = part.optJSONArray("blockDevices") ?: JSONArray()
            appendLine("Блочных устройств: ${devices.length()}")
            appendLine("Сведения о /proc/partitions и /proc/mounts включены в JSON")
            appendLine()
            appendLine("ЭКРАН")''', 1)

          required = ["collectMediaCodecs()", "collectPartitionInfo()", "BuildConfig.VERSION_NAME"]
          if not all(x in s for x in required):
              raise SystemExit("v0.4.0 source verification failed")
          path.write_text(s)
          print("v0.4.0 source changes applied and verified")
          PY

      - name: Upload source snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-source-snapshot
          path: |
            ${{ env.PROJECT_DIR }}/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
            ${{ env.PROJECT_DIR }}/app/build.gradle.kts
            ${{ env.PROJECT_DIR }}/app/src/main/AndroidManifest.xml
            ${{ env.PROJECT_DIR }}/build.gradle.kts
            ${{ env.PROJECT_DIR }}/settings.gradle.kts
          if-no-files-found: error

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
