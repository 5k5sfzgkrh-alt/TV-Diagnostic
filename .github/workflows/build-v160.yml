name: Build TV Diagnostic v1.6.0 Read-only LAN
on:
  push:
    branches: [ tv-diagnostic-v1.6.0-readonly-lan ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reviewed source
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q TV-Diagnostic-v1.3.3-project-root-reviewed.zip -d project
          test -s project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
          grep -q 'versionCode = 133' project/app/build.gradle.kts
      - name: Set v1.6.0 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path("project/app/build.gradle.kts"); s=p.read_text()
          for a,b in [("versionCode = 133","versionCode = 160"),('versionName = "1.3.3"','versionName = "1.6.0"'),('applicationId = "com.tvdiagnostic.hi3751.v133"','applicationId = "com.tvdiagnostic.hi3751.v160"')]:
              if s.count(a)!=1: raise SystemExit("Gradle anchor mismatch: "+a)
              s=s.replace(a,b,1)
          p.write_text(s)
          m=Path("project/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android","http://schemas.android.com/apk/res/android")
          t=ET.parse(m); app=t.getroot().find("application")
          if app is None: raise SystemExit("No application element")
          app.set("{http://schemas.android.com/apk/res/android}label","TV Diagnostic 1.6.0")
          t.write(m,encoding="utf-8",xml_declaration=True)
          PY
      - name: Apply prior read-only patches
        run: |
          python3 patches/v135_emmc_layout.py
          python3 patches/v140_performance_readonly.py
          python3 patches/v150_readonly_report_hardware.py
      - name: Apply v1.6.0 LAN transfer
        run: python3 patches/v160_readonly_lan.py
      - name: Verify safety and feature anchors
        run: |
          set -euo pipefail
          SRC=project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
          grep -q 'startLanTransferServer' "$SRC"
          grep -q 'Accept-Ranges: bytes' "$SRC"
          grep -q 'MessageDigest.isEqual' "$SRC"
          grep -q 'versionCode = 160' project/app/build.gradle.kts
          ! grep -E 'fastboot flash|dd of=|flash_image|erase_partition|blockdev --setrw' "$SRC"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="$ANDROID_SDK_ROOT"; fi
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee project/APK-SHA256.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee project/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|application-label:"
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Diagnostic-v1.6.0-debug-apk
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            project/APK-SHA256.txt
            project/APK-SIGNATURE.txt
          if-no-files-found: error
          retention-days: 14
