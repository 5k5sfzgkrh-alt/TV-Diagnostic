name: v1.5.0 source audit

on:
  push:
    branches: [ tv-diagnostic-v1.5.0 ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed source and inspect report/share implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q TV-Diagnostic-v1.3.3-project-root-reviewed.zip -d project
          SRC=project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("project/app/src/main/java/com/tvdiagnostic/hi3751/MainActivity.kt")
          lines = p.read_text(encoding="utf-8").splitlines()
          print("SOURCE_LINES", len(lines))
          print("FUNCTION_SIGNATURES")
          for i, line in enumerate(lines):
              if "fun " in line or "override fun " in line:
                  print(f"{i+1:04d}: {line}")
          print("KEYWORD_LINES")
          keywords = re.compile(r"json|report|share|export|FileProvider|ACTION_SEND|create.*file|openFileOutput", re.I)
          hits = [i for i, line in enumerate(lines) if keywords.search(line)]
          for i in hits:
              lo, hi = max(0, i-5), min(len(lines), i+18)
              print(f"\\n===== SOURCE LINES {lo+1}-{hi} =====")
              for j in range(lo, hi):
                  print(f"{j+1:04d}: {lines[j]}")
          print("\\n===== MANIFEST =====")
          manifest = Path("project/app/src/main/AndroidManifest.xml")
          print(manifest.read_text(encoding="utf-8"))
          PY
